[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-truth"
version = "0.1.0"
description = "Declared Software Model vs Observed Runtime Behavior"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Runtime Truth Contributors"}
]
keywords = ["static-analysis", "runtime-analysis", "observability", "verification"]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
runtime-truth = "runtime_truth.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime_truth*"]

[tool.setuptools.package-data]
runtime_truth = ["runtime/docker/*", "runtime/dns/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
